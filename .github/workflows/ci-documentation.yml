name: CI - Documentation

on:
  pull_request:
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "LICENSE"
      - ".github/workflows/ci-documentation.yml"
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "**/*.txt"
      - "LICENSE"
      - ".github/workflows/ci-documentation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject new whitespace errors in documentation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          base="$BASE_SHA"
          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git rev-parse --verify "${base}^{commit}" >/dev/null 2>&1; then
            base=$(git rev-parse "${HEAD_SHA}^" 2>/dev/null || git hash-object -t tree /dev/null)
          fi

          git diff --check "$base" "$HEAD_SHA" -- \
            ':(glob)**/*.md' \
            ':(glob)**/*.txt' \
            LICENSE

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check local links (except imported Java README with upstream-only targets)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: >-
            --no-progress
            --offline
            --include-fragments
            --exclude-path 'node_modules'
            --exclude-path 'legacy-src[\\/]java-asset-manager[\\/]README\.md'
            './**/*.md'
          fail: true
