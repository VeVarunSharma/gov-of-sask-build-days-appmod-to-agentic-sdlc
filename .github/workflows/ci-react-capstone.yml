name: CI - React capstone

on:
  pull_request:
    paths:
      - "capstone-src/web-react/**"
      - ".github/workflows/ci-react-capstone.yml"
  push:
    branches: [main]
    paths:
      - "capstone-src/web-react/**"
      - ".github/workflows/ci-react-capstone.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capstone-src/web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: capstone-src/web-react/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm test
      - run: npm run build
