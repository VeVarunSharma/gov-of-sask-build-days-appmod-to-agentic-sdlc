name: CI - OpenAPI contract

on:
  pull_request:
    paths:
      - "capstone-src/contracts/**"
      - ".github/workflows/ci-openapi.yml"
  push:
    branches: [main]
    paths:
      - "capstone-src/contracts/**"
      - ".github/workflows/ci-openapi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Validate OpenAPI structure
        run: >
          npx --yes @redocly/cli@2.10.0 lint
          capstone-src/contracts/openapi.yml
          --extends minimal
