name: CI - Legacy Java baseline

on:
  pull_request:
    paths:
      - "legacy-src/java-asset-manager/**"
      - "scripts/validation/validate-java.*"
      - ".github/workflows/ci-legacy-java.yml"
  push:
    branches: [main]
    paths:
      - "legacy-src/java-asset-manager/**"
      - "scripts/validation/validate-java.*"
      - ".github/workflows/ci-legacy-java.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build imported baseline (JDK 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-src/java-asset-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: legacy-src/java-asset-manager/pom.xml
      - name: Compile and package without running the known-defective test
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests package

  characterize-known-test-defect:
    name: Characterize known upstream Mockito defect
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: legacy-src/java-asset-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
          cache-dependency-path: legacy-src/java-asset-manager/pom.xml
      - name: Verify the exact upstream test failure
        shell: bash
        run: |
          chmod +x mvnw
          set +e
          ./mvnw -B -ntp test 2>&1 | tee legacy-java-test.log
          test_status=${PIPESTATUS[0]}
          set -e

          if [[ "$test_status" -eq 0 ]]; then
            echo "::error::The known upstream Java test defect no longer reproduces. Update this characterization job so the repaired tests become an authoritative gate."
            exit 1
          fi

          grep -F "S3FileProcessingServiceTest.downloadOriginalCopiesFileFromS3" legacy-java-test.log
          grep -F "Cannot mock/spy class software.amazon.awssdk.core.ResponseInputStream" legacy-java-test.log
          grep -F "Tests run: 4, Failures: 0, Errors: 1, Skipped: 0" legacy-java-test.log
          echo "::notice::The imported baseline still exhibits only the explicitly characterized Mockito final-class defect."
